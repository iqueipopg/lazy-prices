[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lazyprices"
version = "0.1.0"
description = "Replication of Cohen, Malloy and Nguyen (2020) 'Lazy Prices' on the S&P 100 with free data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ignacio Queipo de Llano" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "yfinance>=0.2.40",
    "bto @ git+https://github.com/iqueipopg/backtest-overfitting.git",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
packages = ["lazyprices"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
